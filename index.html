<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Igor Queiroz — Corretor de Imóveis</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%231A1512%27/%3E%3Ctext x=%2750%25%27 y=%2758%25%27 font-family=%27Georgia,serif%27 font-size=%2746%27 fill=%27%23C8A15C%27 text-anchor=%27middle%27%3EIQ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#1A1512;
  --ink-2:#26201B;
  --paper:#FAF9F6;
  --paper-2:#F2EFE8;
  --brass:#B8873A;
  --brass-light:#E3AD53;
  --slate:#6B6259;
  --line:#E6E1D6;
  --text:#211C17;
  --success:#2F6B4F;
  --success-bg:#E7F1EC;
  --alert:#B23A2E;
  --alert-bg:#F7E7E4;
  --warn:#8A6A2E;
  --warn-bg:#F3ECDA;
  --neutral-bg:#EFEBE1;
  --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SFMono-Regular',Consolas,Menlo,monospace;
  --radius:6px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--sans);
  color:var(--text);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--brass-light);}

/* ---------- layout shell ---------- */
#app{display:flex;min-height:100vh;}

#sidebar{
  width:230px;flex:0 0 230px;background:var(--ink);
  color:#DCE0EA;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{
  padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;
}
.brand .mark{
  width:56px;height:56px;margin:0 auto 10px;
}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand h1{font-family:var(--serif);font-size:18px;margin:0;font-weight:600;letter-spacing:.5px;color:#fff;}
.brand p{margin:4px 0 0;font-size:9.5px;color:var(--brass-light);letter-spacing:.14em;text-transform:uppercase;}
.brand .creci{margin:5px 0 0;font-size:9px;color:#8B8175;letter-spacing:.08em;}

nav.navlist{flex:1;padding:10px 0;}
.navgroup-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#6F7A93;
  padding:14px 20px 6px;
}
.navitem{
  display:flex;align-items:center;gap:11px;padding:9px 20px;font-size:13.5px;
  color:#C4CADA;border-left:3px solid transparent;text-decoration:none;
  transition:background .12s, color .12s;
}
.navitem svg{width:15px;height:15px;stroke:currentColor;fill:none;flex-shrink:0;opacity:.85;}
.navitem:hover{background:rgba(255,255,255,.04);color:#fff;}
.navitem.active{
  background:rgba(184,135,58,.18);color:#fff;border-left-color:var(--brass);
}
.sidebar-foot{
  padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6F7A93;
}
.sidebar-foot button{
  background:none;border:1px solid rgba(255,255,255,.18);color:#C4CADA;font-size:11px;
  padding:6px 9px;border-radius:5px;margin-top:8px;width:100%;
}
.sidebar-foot button:hover{border-color:var(--brass);color:#fff;}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  padding:18px 30px;border-bottom:1px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  position:sticky;top:0;z-index:5;
}
#topbar h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:600;}
#topbar .sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
.topbar-actions{display:flex;gap:10px;align-items:center;}
.search-box{
  display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;background:#fff;min-width:200px;
}
.search-box svg{width:13px;height:13px;stroke:var(--slate);flex-shrink:0;}
.search-box input{border:none;outline:none;font-size:13px;width:100%;background:transparent;}

#content{padding:26px 30px 60px;flex:1;}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 14px;
  border-radius:5px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;
  transition:border-color .12s, background .12s;
}
.btn:hover{border-color:var(--brass);}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2);}
.btn-brass{background:var(--brass);border-color:var(--brass);color:#fff;}
.btn-brass:hover{background:#9a7a4b;border-color:#9a7a4b;}
.btn-danger{color:var(--alert);border-color:var(--alert-bg);}
.btn-danger:hover{background:var(--alert-bg);border-color:var(--alert);}
.btn-ghost{border-color:transparent;background:transparent;padding:6px 8px;}
.btn-ghost:hover{background:var(--paper-2);}
.btn-sm{padding:5px 10px;font-size:12px;}

/* ---------- KPI cards ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px;}
.kpi-card{
  background:#fff;border:1px solid var(--line);border-top:3px solid var(--brass);
  border-radius:var(--radius);padding:16px 18px;
}
.kpi-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);margin-bottom:8px;}
.kpi-card .value{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink);}
.kpi-card .value.alert{color:var(--alert);}
.kpi-card .foot{font-size:11.5px;color:var(--slate);margin-top:6px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;}
.panel h3{font-family:var(--serif);font-size:16px;margin:0 0 14px;font-weight:600;}
.panel h3 .hint{font-family:var(--sans);font-size:11.5px;color:var(--slate);font-weight:400;margin-left:8px;}

.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}

/* funnel bars */
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px;}
.funnel-row .flabel{width:120px;flex-shrink:0;color:var(--slate);}
.funnel-row .fbar-wrap{flex:1;background:var(--neutral-bg);border-radius:3px;height:16px;overflow:hidden;}
.funnel-row .fbar{height:100%;background:var(--brass);border-radius:3px;}
.funnel-row .fcount{width:26px;text-align:right;font-family:var(--mono);flex-shrink:0;}

/* ---------- table ---------- */
.table-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
table.data-table thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);
  padding:11px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap;
}
table.data-table tbody td{
  padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;
}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr:hover{background:#FCFBF8;cursor:pointer;}
table.data-table td.wrap{white-space:normal;max-width:260px;}
.mono{font-family:var(--mono);}
.row-actions{display:flex;gap:6px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--slate);}
.empty-state svg{width:34px;height:34px;stroke:var(--brass-light);margin-bottom:10px;}
.empty-state .big{font-family:var(--serif);font-size:17px;color:var(--text);margin-bottom:4px;}

/* badge / stamp */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:11.5px;font-weight:600;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge.success{background:var(--success-bg);color:var(--success);}
.badge.alert{background:var(--alert-bg);color:var(--alert);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.neutral{background:var(--neutral-bg);color:var(--slate);}

/* ---------- modal ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(16,27,51,.45);display:none;align-items:flex-start;
  justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50;
}
.overlay.open{display:flex;}
.modal{
  background:#fff;border-radius:8px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25);
  animation:pop .15s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);}
.modal-head h3{font-family:var(--serif);font-size:18px;margin:0;}
.modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:16px;color:var(--text);outline:none;
  background:#fff;
}
@media(min-width:761px){
  .field input,.field select,.field textarea{font-size:13.5px;}
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brass);}
.field textarea{resize:vertical;min-height:60px;}
.field.readonly input{background:var(--paper-2);color:var(--slate);}

/* toast */
#toast{
  position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:6px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:100;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* mensagens */
.msg-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;}
.msg-card .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--brass);font-weight:700;margin-bottom:4px;}
.msg-card h4{margin:0 0 8px;font-family:var(--serif);font-size:15px;}
.msg-card p{margin:0 0 10px;font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.5;}

/* config */
.config-section{margin-bottom:26px;}
.config-section h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-bottom:10px;}

/* match cards */
.match-list{display:flex;flex-direction:column;gap:10px;}
.match-item{
  display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 16px;
}
.match-score{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-weight:700;font-size:13px;flex-shrink:0;
}
.match-item .info{flex:1;min-width:0;}
.match-item .info .t1{font-size:13.5px;font-weight:600;}
.match-item .info .t2{font-size:12px;color:var(--slate);margin-top:2px;}
.match-item .reasons{font-size:11px;color:var(--slate);}

#menuToggle{display:none;border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 9px;flex-shrink:0;}
@media(max-width:760px){
  #sidebar{position:fixed;left:-230px;transition:left .2s;z-index:60;top:0;height:100vh;padding-top:env(safe-area-inset-top);}
  #sidebar.open{left:0;}
  #main{width:100%;}
  #topbar{padding:14px 16px;flex-wrap:wrap;}
  #content{padding:18px 16px calc(80px + env(safe-area-inset-bottom));}
  .form-grid{grid-template-columns:1fr;}
  .search-box{min-width:120px;}
  #menuToggle{display:inline-flex;align-items:center;justify-content:center;}
  #bottomNav{display:flex;}
}
/* navegação inferior fixa — item 28 do briefing (mobile-first) */
#bottomNav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;
  background:var(--ink);border-top:1px solid rgba(255,255,255,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
#bottomNav .bn-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;padding:9px 2px 8px;color:rgba(255,255,255,.6);font-size:10.5px;
  background:none;border:none;cursor:pointer;
}
#bottomNav .bn-item svg{width:19px;height:19px;stroke:currentColor;fill:none;}
#bottomNav .bn-item.active{color:var(--brass);}
#bottomNav .bn-item.bn-plus{color:#fff;}
#bottomNav .bn-item.bn-plus .bn-circle{
  width:34px;height:34px;border-radius:50%;background:var(--brass);
  display:flex;align-items:center;justify-content:center;margin-bottom:2px;font-size:19px;line-height:1;
}
/* menu do "+" — atalhos rápidos de cadastro (item 28) */
#bnPlusMenu{
  position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:71;
  background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;display:none;
}
#bnPlusMenu.open{display:block;}
#bnPlusMenu button{
  display:block;width:100%;text-align:left;padding:14px 18px;border:none;background:#fff;
  font-size:14.5px;border-bottom:1px solid var(--line);color:var(--text);
}
#bnPlusMenu button:last-child{border-bottom:none;}
#bnPlusMenu button:active{background:var(--paper-2);}
</style>
</head>

<script>
/* =========================================================
   CRM IQ — sistema offline de corretagem
   Todos os dados ficam em localStorage no navegador do usuário.
   ========================================================= */

/* ---------------- utilidades ---------------- */
const $ = (sel,el=document)=>el.querySelector(sel);
const $$ = (sel,el=document)=>Array.from(el.querySelectorAll(sel));
const todayISO = ()=> new Date().toISOString().slice(0,10);
const nowISO = ()=> new Date().toISOString().slice(0,16);
function fmtDate(v){
  if(!v) return '—';
  const d = v.length>10? new Date(v) : new Date(v+'T00:00:00');
  if(isNaN(d)) return v;
  return d.toLocaleDateString('pt-BR', v.length>10? {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtMoney(v){
  const n = Number(v||0);
  return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function fmtPct(v){ return (v===''||v===undefined||v===null? '—' : Number(v).toLocaleString('pt-BR')+'%'); }
function daysBetween(a,b){
  if(!a) return null;
  const d1=new Date(a+'T00:00:00'), d2 = b? new Date(b+'T00:00:00') : new Date();
  return Math.round((d2-d1)/86400000);
}
function uid(prefix){
  store.meta.seq[prefix] = (store.meta.seq[prefix]||0)+1;
  return prefix+'-'+String(store.meta.seq[prefix]).padStart(4,'0');
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'),2200);
}
function escapeHtml(s){ return (s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- armazenamento ---------------- */
const STORAGE_KEY = 'crmiq_v1';
function defaultStore(){
  return {
    meta:{ seq:{}, lastBackupAt:null, lastRestoreAt:null, lastAutoBackupAt:null },
    config:{
      corretora:'Igor Queiroz', corretorPadrao:'Igor Queiroz', comissaoPadrao:6, metaMensal:10000
    },
    clientes:[], imoveis:[], captacao:[], visitas:[], negociacoes:[],
    financeiro:[], qualificacao:[], historico:[], tarefas:[], mensagens:[]
  };
}
let store = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return seedMensagens(defaultStore());
    const parsed = JSON.parse(raw);
    return migrateStore(addCadenciaRenan(Object.assign(defaultStore(), parsed)));
  }catch(e){ console.error(e); return seedMensagens(defaultStore()); }
}
/* Migração de registros antigos para os novos campos estruturados,
   sem apagar nenhum dado já cadastrado. */
function migrateStore(s){
  (s.imoveis||[]).forEach(im=>{
    if(!im.areaConstruida && im.area) im.areaConstruida = im.area;
    if(!im.finalidade) im.finalidade = 'Venda';
    if(!im.modalidade) im.modalidade = 'Pronto';
  });
  if(!s.meta) s.meta = {seq:{}};
  if(s.meta.lastAutoBackupAt===undefined) s.meta.lastAutoBackupAt = null;
  if(s.meta.lastBackupAt===undefined) s.meta.lastBackupAt = null;
  if(s.meta.lastRestoreAt===undefined) s.meta.lastRestoreAt = null;
  return s;
}
function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    return true;
  }catch(e){
    console.error('save() falhou', e);
    // Armazenamento pode estar cheio (ex.: muitos backups automáticos acumulados).
    // Tenta liberar espaço removendo os backups automáticos e salvar de novo, uma vez.
    try{
      localStorage.removeItem(AUTO_BACKUP_KEY);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      toast('Aviso: armazenamento quase cheio. Backups automáticos antigos foram removidos para liberar espaço.');
      return true;
    }catch(e2){
      console.error('save() falhou mesmo após liberar espaço', e2);
      toast('ERRO ao salvar: o armazenamento deste navegador está cheio ou bloqueado (ex.: Navegação Privada / modo anônimo). A alteração pode não ter sido salva — exporte um backup manual assim que possível.');
      return false;
    }
  }
}
/* ---------------- Backup automático periódico (item 1) ----------------
   Além do backup manual (arquivo .json), guarda periodicamente uma cópia
   rotativa completa dos dados dentro do próprio localStorage, sem exigir
   nenhuma ação do usuário. Mantém as últimas AUTO_BACKUP_MAX cópias.
   Isso NÃO substitui o backup exportado (arquivo), é uma camada extra de
   segurança caso algo dê errado neste mesmo aparelho/navegador. */
const AUTO_BACKUP_KEY = 'crmiq_v1_autoBackups';
const AUTO_BACKUP_MAX = 5;
const AUTO_BACKUP_INTERVAL_MS = 10*60*1000; // 10 minutos
function listAutoBackups(){
  try{ return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY))||[]; }catch(e){ return []; }
}
function runAutoBackup(){
  try{
    const totalRegistros = ['clientes','imoveis','captacao','visitas','negociacoes','financeiro','qualificacao','historico','tarefas'].reduce((s,k)=>s+(store[k]||[]).length,0);
    if(!totalRegistros) return; // nada para proteger ainda
    const list = listAutoBackups();
    list.unshift({savedAt:new Date().toISOString(), totalRegistros, data:store});
    while(list.length>AUTO_BACKUP_MAX) list.pop();
    localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(list));
    store.meta.lastAutoBackupAt = new Date().toISOString();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    if(currentView==='backup') renderView();
  }catch(e){ console.error('auto-backup falhou', e); }
}
setInterval(runAutoBackup, AUTO_BACKUP_INTERVAL_MS);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') runAutoBackup(); });
window.addEventListener('beforeunload', runAutoBackup);

/* Cadência de follow-up (metodologia Renan Reczigel) — injeta os modelos
   de mensagem se ainda não existirem na base, sem apagar mensagens já
   criadas/editadas pelo usuário. Usada tanto em base nova quanto em
   bases já existentes (migração no load()). */
function addCadenciaRenan(s){
  const existentes = new Set((s.mensagens||[]).map(m=>m.id));
  const modelos = [
    {id:'MSG-R1', categoria:'Primeiro contato', titulo:'Retorno de ligação (atendeu)', texto:'Olá {nome}, tudo bem? Aqui é o(a) {corretora}, retornando seu contato de agora há pouco. Prazer em falar com você! Quais informações você precisa sobre o imóvel que se cadastrou?'},
    {id:'MSG-R2', categoria:'Cadência Renan', titulo:'Não atendeu a ligação', texto:'Oi {nome}! Tentei falar com você por telefone agora há pouco. O que te chamou atenção para entrar em contato com a gente?'},
    {id:'MSG-R3', categoria:'Cadência Renan', titulo:'Follow-up 1 — pedido de retorno', texto:'Olá {nome}, você não tem nenhuma obrigação de me responder — é uma parceria comercial. Mas para eu conseguir seguir te ajudando, preciso da sua resposta. Você ainda tem interesse em falar sobre esse assunto?'},
    {id:'MSG-R4', categoria:'Cadência Renan', titulo:'Follow-up 2 — autoridade', texto:'Sei que procurar imóvel é cansativo, com vários corretores chamando e ainda a correria do dia a dia. Já ajudei muitos clientes a tornar esse processo mais leve. Posso te enviar uma apresentação rápida para conversarmos?'},
    {id:'MSG-R5', categoria:'Cadência Renan', titulo:'Follow-up 3 — vídeo de apresentação', texto:'Oi {nome}! Vou te mandar um vídeo rápido para a gente se conhecer melhor. Depois me conta: qual o valor de entrada que você tem disponível e a faixa de parcela que cabe no seu bolso hoje?'},
    {id:'MSG-R6', categoria:'Cadência Renan', titulo:'Follow-up final — persistência empática', texto:'Oi {nome}, tentei contato algumas vezes e não quero ser inconveniente. Sou uma pessoa de verdade tentando te ajudar, não um robô 🙂. Você ainda tem interesse em falar sobre esse assunto? Se não tiver, posso encerrar por aqui sem problema nenhum.'},
  ];
  modelos.forEach(m=>{ if(!existentes.has(m.id)) s.mensagens.push(m); });
  return s;
}

const REF_LABEL = {
  clientes: r => r.nome || '(sem nome)',
  imoveis: r => `${r.codigo||r.id} · ${r.bairro||''} · ${fmtMoney(r.valor)}`,
  negociacoes: r => `${r.id} · ${(store.clientes.find(c=>c.id===r.idCliente)||{}).nome||''}`,
};
function refOptions(targetModule){
  return (store[targetModule]||[]).map(r=>({value:r.id,label:REF_LABEL[targetModule](r)}));
}
function refLabel(targetModule,id){
  const r = (store[targetModule]||[]).find(x=>x.id===id);
  return r? REF_LABEL[targetModule](r) : '—';
}

/* ---------------- detecção de duplicados (item 29) ---------------- */
function normText(s){ return (s||'').toString().trim().toLowerCase(); }
function normPhone(s){ return (s||'').toString().replace(/\D/g,''); }
function findPossibleDuplicate(key, data){
  if(key==='clientes'){
    const nome = normText(data.nome), fone = normPhone(data.whatsapp);
    const hit = store.clientes.find(c=> (fone && normPhone(c.whatsapp)===fone) || (nome && normText(c.nome)===nome));
    return hit? {id:hit.id, label:hit.nome} : null;
  }
  if(key==='imoveis'){
    const cod = normText(data.codigo), end = normText(data.endereco);
    const hit = store.imoveis.find(i=> (cod && normText(i.codigo)===cod) || (end && end.length>6 && normText(i.endereco)===end));
    return hit? {id:hit.id, label:(hit.codigo||hit.id)+' · '+(hit.endereco||hit.bairro||'')} : null;
  }
  return null;
}

/* ---------------- badge helper ---------------- */
const BADGE_MAP = {
  success:['Disponível','Aberta','Ganha','Fechado','Recebido','Qualificado','Realizada','Concluída','Captado','Sim','Em dia'],
  alert:['Suspenso','Perdida','Perdido','Atrasado','Crítico','Não Qualificado','Cancelada','Não Compareceu','Recusado','Não'],
  warn:['Reservado','Pendente','Em análise','Atenção','Parcial','Agendada','Agendado','Em contato','Novo','Reagendar','Cadência concluída'],
};
function badgeClass(v){
  for(const k in BADGE_MAP){ if(BADGE_MAP[k].includes(v)) return k; }
  return 'neutral';
}
function badge(v){
  if(v===undefined||v===null||v==='') return '<span class="badge neutral"><span class="dot"></span>—</span>';
  return `<span class="badge ${badgeClass(v)}"><span class="dot"></span>${escapeHtml(v)}</span>`;
}

      r.diasParado = r.ultimoContato!=null? daysBetween(r.ultimoContato) : null;

/* =========================================================
   ROTEAMENTO E RENDER
   ========================================================= */
let currentView = 'dashboard';
let currentSearch = '';
let currentFichaKey = null, currentFichaId = null;
function openFicha(key, id){
  currentFichaKey = key; currentFichaId = id; currentView = 'ficha';
  renderTopbar(); renderView(); renderBottomNav();
}

function route(){
  const hash = location.hash.replace('#','') || 'dashboard';
  currentView = hash; currentSearch='';
  renderSidebar();
  renderTopbar();
  renderView();
  renderBottomNav();
  $('#sidebar').classList.remove('open');
}
window.addEventListener('hashchange', route);

/* Navegação inferior fixa para uso no celular (item 28 do briefing):
   Painel / Clientes / Follow-up / Agenda / + (atalhos de cadastro). */
const BOTTOM_NAV_ITEMS = [
  {key:'dashboard', label:'Painel', icon:'dashboard'},
  {key:'clientes', label:'Clientes', icon:'users'},
  {key:'followup', label:'Follow-up', icon:'followup'},
  {key:'agenda', label:'Agenda', icon:'calendar'},
];
function renderBottomNav(){
  const bar = $('#bottomNav');
  const active = currentView==='ficha' ? currentFichaKey : currentView;
  bar.innerHTML = BOTTOM_NAV_ITEMS.map(it=>
    `<a href="#${it.key}" class="bn-item${active===it.key?' active':''}">${iconSvg(it.icon)}<span>${it.label}</span></a>`
  ).join('') + `<button class="bn-item bn-plus" id="bnPlusBtn" type="button"><span class="bn-circle">＋</span><span>Novo</span></button>`;
  $('#bnPlusBtn').onclick = toggleBnPlusMenu;
}
function toggleBnPlusMenu(){
  const menu = $('#bnPlusMenu');
  if(menu.classList.contains('open')){ menu.classList.remove('open'); menu.innerHTML=''; return; }
  const opcoes = [
    {label:'Novo Cliente', act:()=>openForm('clientes', null)},
    {label:'Novo Imóvel', act:()=>openForm('imoveis', null)},
    {label:'Nova Tarefa', act:()=>openForm('tarefas', null)},
    {label:'Nova Visita', act:()=>openForm('visitas', null)},
    {label:'Nova Negociação', act:()=>openForm('negociacoes', null)},
  ];
  menu.innerHTML = opcoes.map((o,i)=>`<button type="button" data-i="${i}">${o.label}</button>`).join('');
  menu.classList.add('open');
  menu.querySelectorAll('button').forEach(b=> b.onclick = ()=>{ menu.classList.remove('open'); menu.innerHTML=''; opcoes[b.dataset.i].act(); });
  setTimeout(()=>{
    document.addEventListener('click', closeBnPlusMenuOutside, {once:true});
  }, 0);
}
function closeBnPlusMenuOutside(e){
  const menu = $('#bnPlusMenu');
  if(!menu.contains(e.target) && e.target.id!=='bnPlusBtn' && !e.target.closest('#bnPlusBtn')){
    menu.classList.remove('open'); menu.innerHTML='';
  }
}

function renderSidebar(){
  const nav = $('#navlist'); nav.innerHTML='';
  NAV.forEach(g=>{
    const gl = document.createElement('div'); gl.className='navgroup-label'; gl.textContent=g.group;
    nav.appendChild(gl);
    g.items.forEach(it=>{
      const a = document.createElement('a');
      a.href = '#'+it.key;
      a.className = 'navitem'+((currentView===it.key || (currentView==='ficha' && currentFichaKey===it.key))?' active':'');
      a.innerHTML = iconSvg(it.icon)+'<span>'+it.label+'</span>';
      nav.appendChild(a);
    });
  });
  $('#brokerageName').textContent = store.config.corretora || 'Igor Queiroz';
}

function findNavLabel(key){
  for(const g of NAV) for(const it of g.items) if(it.key===key) return it;
  return {label:key};
}

function renderTopbar(){
  const nv = findNavLabel(currentView);
  if(currentView==='ficha'){
    $('#viewTitle').textContent = currentFichaKey==='clientes'? 'Ficha do Cliente' : 'Ficha do Imóvel';
  } else {
    $('#viewTitle').textContent = nv.label;
  }
  const subs = {
    dashboard:'Panorama do dia e indicadores da corretagem',
    followup:'Clientes que precisam de retorno agora',
    match:'Sugestões automáticas cliente × imóvel',
    mensagens:'Modelos de mensagem para WhatsApp',
    backup:'Salve seus dados e use o mesmo CRM em outros aparelhos',
    config:'Parâmetros gerais do sistema e backup',
    ficha:'Visão 360° — todas as informações em um só lugar',
    alertas:'Central de alertas — tudo que precisa da sua atenção',
    agenda:'Hoje, amanhã e próximos dias em um só lugar',
    relatorios:'Leads, atendimento, vendas e origem dos clientes',
  };
  $('#viewSubtitle').textContent = subs[currentView] || (MODULES[currentView]? MODULES[currentView].sub : '');

  const actions = $('#topbarActions'); actions.innerHTML='';

  if(MODULES[currentView]){
    const search = document.createElement('div'); search.className='search-box';
    search.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar nesta lista..." id="searchInput">`;
    actions.appendChild(search);
    search.querySelector('input').addEventListener('input', e=>{ currentSearch=e.target.value.toLowerCase(); renderView(); });
  } else {
    // Busca global — disponível fora das telas de módulo (item 26 do briefing)
    const gsearch = document.createElement('div'); gsearch.className='search-box';
    gsearch.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" placeholder="Busca global (Enter)..." id="globalSearchInput">`;
    actions.appendChild(gsearch);
    gsearch.querySelector('input').addEventListener('keydown', e=>{
      if(e.key==='Enter' && e.target.value.trim()) openGlobalSearchResults(e.target.value.trim());
    });
  }

  // Novo Atendimento — cadastro rápido (item 4 do briefing)
  const novoAtBtn = document.createElement('button'); novoAtBtn.className='btn btn-brass';
  novoAtBtn.innerHTML = `＋ Novo Atendimento`;
  novoAtBtn.onclick = openNovoAtendimento;
  actions.appendChild(novoAtBtn);

  if(MODULES[currentView]){
    const addBtn = document.createElement('button'); addBtn.className='btn btn-primary';
    addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Novo`;
    addBtn.onclick = ()=>openForm(currentView, null);
    actions.appendChild(addBtn);
  }
  if(currentView==='mensagens'){
    const addBtn = document.createElement('button'); addBtn.className='btn btn-primary';
    addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg> Novo Modelo`;
    addBtn.onclick = ()=>openMessageForm(null);
    actions.appendChild(addBtn);
  }
}

function renderView(){
  const c = $('#content'); c.innerHTML='';
  if(currentView==='dashboard') return renderDashboard(c);
  if(currentView==='followup') return renderFollowup(c);
  if(currentView==='match') return renderMatch(c);
  if(currentView==='mensagens') return renderMensagens(c);
  if(currentView==='backup') return renderBackup(c);
  if(currentView==='config') return renderConfig(c);
  if(currentView==='alertas') return renderAlertas(c);
  if(currentView==='agenda') return renderAgenda(c);
  if(currentView==='relatorios') return renderRelatorios(c);
  if(currentView==='ficha' && currentFichaKey==='clientes') return renderClienteFicha(c, currentFichaId);
  if(currentView==='ficha' && currentFichaKey==='imoveis') return renderImovelFicha(c, currentFichaId);
  if(MODULES[currentView]) return renderModuleTable(c, currentView);
  location.hash = '#dashboard';
}

/* ---------------- generic module table ---------------- */
/* Filtros rápidos por módulo (item 27 do briefing) */
const FILTER_FIELDS = {
  clientes: ['etapa','temperatura','origem'],
  imoveis: ['finalidade','modalidade','localizacao','status'],
  negociacoes: ['etapa','status'],
};
let moduleFilters = {};

function renderModuleTable(c, key){
  const mod = MODULES[key];
  let rows = store[key].map(r=> mod.computed? mod.computed({...r}) : r);

  if(FILTER_FIELDS[key]){
    const bar = document.createElement('div'); bar.className='panel'; bar.style.padding='12px 16px';
    const active = moduleFilters[key] || {};
    bar.innerHTML = `<div class="row-actions" style="flex-wrap:wrap;align-items:center;gap:10px">
      <strong style="font-size:12.5px;color:var(--slate)">Filtrar:</strong>
      ${FILTER_FIELDS[key].map(fk=>{
        const f = mod.fields.find(x=>x.k===fk);
        if(!f) return '';
        return `<select data-filter="${fk}" style="max-width:170px"><option value="">${f.label} (todos)</option>${f.opts.map(o=>`<option value="${o}" ${active[fk]===o?'selected':''}>${o}</option>`).join('')}</select>`;
      }).join('')}
      <button class="btn btn-ghost btn-sm" id="clearFilters">Limpar filtros</button>
    </div>`;
    c.appendChild(bar);
    bar.querySelectorAll('[data-filter]').forEach(sel=>{
      sel.onchange = ()=>{
        moduleFilters[key] = moduleFilters[key] || {};
        moduleFilters[key][sel.dataset.filter] = sel.value;
        renderView();
      };
    });
    bar.querySelector('#clearFilters').onclick = ()=>{ moduleFilters[key] = {}; renderView(); };
    Object.entries(active).forEach(([fk,val])=>{ if(val) rows = rows.filter(r=>r[fk]===val); });
  }

  if(key==='financeiro' || key==='negociacoes') c.appendChild(renderFinanceSummary(key, rows));

  if(currentSearch){
    rows = rows.filter(r=>{
      const hay = mod.searchable.map(f=>String(r[f]||'')).join(' ').toLowerCase()
        + (r.idCliente? refLabel('clientes',r.idCliente).toLowerCase():'')
        + (r.idImovel? refLabel('imoveis',r.idImovel).toLowerCase():'');
      return hay.includes(currentSearch);
    });
  }
  const wrap = document.createElement('div');
  if(rows.length===0){
    wrap.innerHTML = emptyState(mod.label);
    c.appendChild(wrap);
    return;
  }
  const table = document.createElement('div'); table.className='table-wrap';
  const cols = mod.listCols;
  let thead = '<thead><tr>'+cols.map(k=>`<th>${fieldLabel(mod,k)}</th>`).join('')+'<th></th></tr></thead>';
  let tbody = '<tbody>'+rows.map(r=>{
    const cells = cols.map(k=>{
      const f = mod.fields.find(x=>x.k===k) || {k};
      return `<td class="${k==='descricao'||k==='observacoes'?'wrap':''}">${mod.render(r[k],f,r)}</td>`;
    }).join('');
    const temFicha = key==='clientes' || key==='imoveis';
    return `<tr data-id="${r.id}">${cells}<td class="row-actions">
      ${temFicha? `<button class="btn btn-ghost btn-sm" data-act="ficha" data-id="${r.id}" title="Ver Ficha 360°">👁</button>` : ''}
      <button class="btn btn-ghost btn-sm" data-act="edit" data-id="${r.id}" title="Editar">${iconSvg('gear').replace('<svg','<svg style="width:13px;height:13px"')}</button>
      <button class="btn btn-ghost btn-sm" data-act="del" data-id="${r.id}" title="Excluir">✕</button>
    </td></tr>`;
  }).join('')+'</tbody>';
  table.innerHTML = `<table class="data-table">${thead}${tbody}</table>`;
  c.appendChild(table);

  table.querySelectorAll('tbody tr').forEach(tr=>{
    tr.addEventListener('click', e=>{
      if(e.target.closest('[data-act="del"]')){
        e.stopPropagation();
        if(confirm('Excluir este registro?')){
          const backupAntes = store[key];
          store[key] = store[key].filter(x=>x.id!==tr.dataset.id);
          if(save()){ toast('Registro excluído.'); renderView(); }
          else { store[key] = backupAntes; }
        }
        return;
      }
      if(e.target.closest('[data-act="ficha"]')){
        e.stopPropagation();
        openFicha(key, tr.dataset.id);
        return;
      }
      openForm(key, tr.dataset.id);
    });
  });
}
/* Painel-resumo financeiro (itens 3 e 20 do briefing): VGV, comissão
   prevista/recebida/a receber/atrasada, filtrado por "este mês". */
function renderFinanceSummary(key, rows){
  const panel = document.createElement('div'); panel.className='panel';
  const mesAtual = todayISO().slice(0,7);
  if(key==='financeiro'){
    const doMes = rows.filter(r=>(r.dataVenda||'').slice(0,7)===mesAtual);
    const sum = (arr,f)=> arr.reduce((s,r)=>s+Number(f(r)||0),0);
    const vgvMes = sum(doMes, r=>r.valorVenda);
    const previstaMes = sum(doMes, r=>r.comissaoPrevista);
    const recebidaMes = sum(doMes, r=>r.comissaoRecebida);
    const aReceber = sum(rows.filter(r=>r.status==='Pendente'||r.status==='Parcial'), r=>r.comissaoPrevista-Number(r.comissaoRecebida||0));
    const atrasada = sum(rows.filter(r=>r.status==='Atrasado'), r=>r.comissaoPrevista-Number(r.comissaoRecebida||0));
    panel.innerHTML = `<h3>Este Mês <span class="hint">${new Date(mesAtual+'-01T00:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</span></h3>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="label">VGV Vendido</div><div class="value">${fmtMoney(vgvMes)}</div></div>
        <div class="kpi-card"><div class="label">Comissão Prevista</div><div class="value">${fmtMoney(previstaMes)}</div></div>
        <div class="kpi-card"><div class="label">Comissão Recebida</div><div class="value">${fmtMoney(recebidaMes)}</div></div>
        <div class="kpi-card"><div class="label">A Receber (total)</div><div class="value">${fmtMoney(aReceber)}</div></div>
        <div class="kpi-card"><div class="label">Atrasada (total)</div><div class="value alert">${fmtMoney(atrasada)}</div></div>
      </div>`;
  } else {
    const abertas = rows.filter(r=>r.status==='Aberta');
    const fechadas = rows.filter(r=>r.etapa==='Fechado' || r.status==='Ganha');
    const vgvNeg = abertas.reduce((s,r)=>s+Number(r.valorProposta||0),0);
    const vgvVendido = fechadas.reduce((s,r)=>s+Number(r.valorFinal||r.valorProposta||0),0);
    const comissaoPrevista = abertas.reduce((s,r)=>s+Number(r.comissaoPotencial||0),0);
    panel.innerHTML = `<h3>Resumo Financeiro das Negociações</h3>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="label">VGV em Negociação</div><div class="value">${fmtMoney(vgvNeg)}</div></div>
        <div class="kpi-card"><div class="label">VGV Vendido</div><div class="value">${fmtMoney(vgvVendido)}</div></div>
        <div class="kpi-card"><div class="label">Comissão Potencial (abertas)</div><div class="value">${fmtMoney(comissaoPrevista)}</div></div>
      </div>`;
  }
  return panel;
}
function fieldLabel(mod,k){
  const f = mod.fields.find(x=>x.k===k);
  if(f) return f.label;
  const extra = {comissaoPrevista:'Comissão Prevista', diasParado:'Dias Parado', alerta:'Alerta', score:'Score', classificacao:'Classificação', idCliente:'Cliente', idImovel:'Imóvel', idNegociacao:'Negociação', dataHora:'Data/Hora'};
  return extra[k] || k;
}
function emptyState(label){

/* ---------------- generic form modal ---------------- */
function openForm(key, id){
  const mod = MODULES[key];
  const record = id? store[key].find(r=>r.id===id) : null;
  const isEdit = !!record;
  const overlay = $('#overlay'); const modal = $('#modal');

  const fieldsHtml = mod.fields.map(f=>{
    const val = record? record[f.k] : (f.default? f.default() : '');
    return `<div class="field ${f.full?'full':''}"><label>${f.label}${f.required?' *':''}</label>${renderInput(f,val)}</div>`;
  }).join('');

  modal.innerHTML = `
    <div class="modal-head"><h3>${isEdit? 'Editar':'Novo'} — ${mod.label}</h3>
      <button class="btn btn-ghost btn-sm" id="closeModal">✕</button></div>
    <div class="modal-body"><form id="recordForm" class="form-grid">${fieldsHtml}</form></div>
    <div class="modal-foot">
      ${isEdit? '<button class="btn btn-danger" id="delInModal">Excluir</button>':'<span></span>'}
      <div style="flex:1"></div>
      <button class="btn" id="cancelModal">Cancelar</button>
      <button class="btn btn-primary" id="saveModal">Salvar</button>
    </div>`;
  overlay.classList.add('open');

  if(key==='clientes'){
    // Cadência automática de follow-up (metodologia Renan Reczigel):
    // toda vez que "Último Contato" é preenchido/alterado, o sistema
    // agenda o "Próximo Contato" 24h depois e avança o contador de
    // tentativas (até 5). Se o cliente responder, a cadência para.
    const ultimoInput = $('[name="ultimoContato"]', modal);
    const respondeuInput = $('[name="respondeu"]', modal);
    const tentativasInput = $('[name="tentativas"]', modal);
    const proximoInput = $('[name="proximoContato"]', modal);
    if(tentativasInput){ tentativasInput.readOnly = true; tentativasInput.style.background = '#f4f4f4'; }
    if(proximoInput){ proximoInput.readOnly = true; proximoInput.style.background = '#f4f4f4'; }
    const recalcCadencia = (novaTentativa)=>{
      if(!ultimoInput || !ultimoInput.value) return;
      let tent = Number(tentativasInput.value||0);
      if(novaTentativa) tent = Math.min(tent+1, 5);
      tentativasInput.value = tent;
      if(respondeuInput && respondeuInput.value==='Sim'){ proximoInput.value = ''; return; }
      if(tent>=5){
        proximoInput.value = '';
        toast('5ª tentativa sem resposta — avalie encerrar ou reciclar o lead.');
        return;
      }
      const d = new Date(ultimoInput.value+'T00:00:00');
      d.setDate(d.getDate()+1);
      proximoInput.value = d.toISOString().slice(0,10);
    };
    if(ultimoInput) ultimoInput.addEventListener('change', ()=>recalcCadencia(true));
    if(respondeuInput) respondeuInput.addEventListener('change', ()=>recalcCadencia(false));
  }

  if(key==='imoveis'){
    // Cronograma de entrega só faz sentido para imóvel na planta/lançamento/em construção
    const modalidadeInput = $('[name="modalidade"]', modal);
    const cronogramaFields = ['etapa1Desc','etapa1Data','etapa2Desc','etapa2Data','etapa3Desc','etapa3Data','etapa4Desc','etapa4Data']
      .map(k=> $(`[name="${k}"]`, modal)?.closest('.field')).filter(Boolean);
    const toggleCronograma = ()=>{
      const show = ['Imóvel na planta','Lançamento','Em construção'].includes(modalidadeInput?.value);
      cronogramaFields.forEach(elField=> elField.style.display = show? '':'none');
    };
    if(modalidadeInput){ modalidadeInput.addEventListener('change', toggleCronograma); toggleCronograma(); }
  }

  $('#closeModal').onclick = $('#cancelModal').onclick = closeModal;
  overlay.onclick = e=>{ if(e.target===overlay) closeModal(); };
  if(isEdit) $('#delInModal').onclick = ()=>{
    if(confirm('Excluir este registro?')){
      const backupAntes = store[key];
      store[key] = store[key].filter(r=>r.id!==id);
      if(save()){ toast('Registro excluído.'); closeModal(); renderView(); }
      else { store[key] = backupAntes; }
    }
  };
  $('#saveModal').onclick = ()=>{
    const data = {};
    mod.fields.forEach(f=>{
      const el = $(`[name="${f.k}"]`, modal);
      data[f.k] = el ? el.value : '';
    });
    const missing = mod.fields.filter(f=>f.required && !data[f.k]);
    if(missing.length){ toast('Preencha: '+missing.map(f=>f.label).join(', ')); return; }
    if(!isEdit){
      const dup = findPossibleDuplicate(key, data);
      if(dup){
        if(confirm(`${key==='clientes'?'Cliente':'Imóvel'} semelhante encontrado: "${dup.label}". Deseja abrir o cadastro existente em vez de criar um novo?`)){
          closeModal(); openForm(key, dup.id); return;
        }
      }
    }
    if(isEdit){
      Object.assign(record, data);
    } else {
      data.id = uid(mod.idPrefix);
      store[key].push(data);
    }
    if(key==='clientes') syncTarefaCadencia(isEdit? record : data);
    if(key==='negociacoes') syncPosVenda(isEdit? record : data);
    save(); toast('Salvo com sucesso.'); closeModal(); renderView();
  };
}

/* Cria/atualiza automaticamente a Tarefa de follow-up do cliente,
   sincronizada com a cadência de 24h (Próximo Contato/Tentativas).
   Tarefas marcadas com cadenciaAuto:true são geridas pelo sistema;
   tarefas criadas manualmente pelo usuário nunca são tocadas. */
function syncTarefaCadencia(cli){
  const existente = store.tarefas.find(t=>t.idCliente===cli.id && t.cadenciaAuto && t.status==='Pendente');
  const encerrado = ['Fechado','Perdido'].includes(cli.etapa) || cli.respondeu==='Sim';
  const tent = Number(cli.tentativas||0);

  if(!encerrado && cli.proximoContato){
    const descricao = `Follow-up (tentativa ${tent}/5): ${cli.nome}`;
    const prioridade = tent>=4? 'Alta' : tent>=2? 'Média' : 'Baixa';
    if(existente){
      Object.assign(existente, {data:cli.proximoContato, descricao, prioridade, tipo:'WhatsApp'});
    } else {
      store.tarefas.push({
        id:uid('TAR'), data:cli.proximoContato, prioridade, tipo:'WhatsApp',
        idCliente:cli.id, descricao, status:'Pendente', cadenciaAuto:true
      });
    }
  } else if(!encerrado && tent>=5 && !cli.proximoContato){
    const descricao = `Avaliar encerrar/reciclar lead: ${cli.nome} (5 tentativas sem resposta)`;
    if(existente){
      Object.assign(existente, {data:todayISO(), descricao, prioridade:'Alta', tipo:'Outro'});
    } else {
      store.tarefas.push({
        id:uid('TAR'), data:todayISO(), prioridade:'Alta', tipo:'Outro',
        idCliente:cli.id, descricao, status:'Pendente', cadenciaAuto:true
      });
    }
  } else if(existente){
    // cliente respondeu ou etapa fechada/perdida: cadência encerrada
    existente.status = 'Concluída';
  }
}

/* Pós-venda (item 19 do briefing): quando a negociação chega em
   "Fechado" ou "Pós-venda", cria automaticamente as tarefas de
   acompanhamento (30 dias, pedir indicação, verificar satisfação),
   vinculadas à negociação. Não duplica se já existirem. */
function syncPosVenda(neg){
  if(!['Fechado','Pós-venda'].includes(neg.etapa)) return;
  const cliente = store.clientes.find(c=>c.id===neg.idCliente);
  const nomeCli = cliente? cliente.nome : refLabel('clientes', neg.idCliente);
  const modelos = [
    {sufixo:'30d', dias:30, prioridade:'Média', descricao:`Entrar em contato 30 dias após a venda: ${nomeCli}`},
    {sufixo:'indicacao', dias:35, prioridade:'Baixa', descricao:`Pedir indicação: ${nomeCli}`},
    {sufixo:'satisfacao', dias:7, prioridade:'Alta', descricao:`Verificar satisfação do cliente: ${nomeCli}`},
  ];
  modelos.forEach(m=>{
    const jaExiste = store.tarefas.some(t=>t.idNegociacao===neg.id && t.posVendaAuto===m.sufixo);
    if(jaExiste) return;
    const d = new Date(); d.setDate(d.getDate()+m.dias);
    store.tarefas.push({
      id:uid('TAR'), data:d.toISOString().slice(0,10), prioridade:m.prioridade, tipo:'Outro',
      idCliente:neg.idCliente, idNegociacao:neg.id, descricao:m.descricao, status:'Pendente', posVendaAuto:m.sufixo
    });
  });
}

function renderInput(f, val){
  val = val===undefined||val===null? '' : val;
  if(f.type==='select'){
    return `<select name="${f.k}"><option value="">—</option>${f.opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
  }
  if(f.type==='ref'){
    const opts = refOptions(f.target);
    return `<select name="${f.k}"><option value="">—</option>${opts.map(o=>`<option value="${o.value}" ${val===o.value?'selected':''}>${escapeHtml(o.label)}</option>`).join('')}</select>`;
  }
  if(f.type==='textarea'){
    return `<textarea name="${f.k}">${escapeHtml(val)}</textarea>`;
  }
  const typeMap = {currency:'number', percent:'number', number:'number', date:'date', datetime:'datetime-local', time:'time', tel:'tel', email:'email', text:'text'};
  const step = (f.type==='currency')? '0.01' : (f.type==='percent'?'0.1':'1');
  return `<input name="${f.k}" type="${typeMap[f.type]||'text'}" ${['currency','percent','number'].includes(f.type)?`step="${step}"`:''} value="${escapeHtml(val)}">`;
}

/* Centro de alertas / próximas ações (itens 2 e 24 do briefing) */
function buildPriorityActions(){
  const list = [];
  // follow-ups atrasados
  store.clientes.filter(x=>!['Fechado','Perdido'].includes(x.etapa) && x.respondeu!=='Sim' && x.proximoContato && x.proximoContato<=todayISO())
    .forEach(cl=> list.push({peso:100, icon:'🔴', categoria:'URGENTE', titulo:`Follow-up atrasado: ${cl.nome}`, detalhe:`Próximo contato era ${fmtDate(cl.proximoContato)} · ${Number(cl.tentativas||0)}/5 tentativas`, onClick:()=>openForm('clientes',cl.id)}));
  // tarefas vencidas
  store.tarefas.filter(t=>t.status==='Pendente' && t.data<todayISO())
    .forEach(t=> list.push({peso:95, icon:'🔴', categoria:'URGENTE', titulo:`Tarefa vencida: ${t.descricao}`, detalhe:`Prevista para ${fmtDate(t.data)}`, onClick:()=>openForm('tarefas',t.id)}));
  // visitas hoje
  store.visitas.filter(v=>v.data===todayISO() && v.status==='Agendada')
    .forEach(v=> list.push({peso:80, icon:'📅', categoria:'HOJE', titulo:`Visita hoje: ${refLabel('clientes',v.idCliente)}`, detalhe:`${v.hora||''} · ${refLabel('imoveis',v.idImovel)}`, onClick:()=>openForm('visitas',v.id)}));
  // tarefas de hoje (não vencidas)
  store.tarefas.filter(t=>t.status==='Pendente' && t.data===todayISO())
    .forEach(t=> list.push({peso:78, icon:'📅', categoria:'HOJE', titulo:`Tarefa de hoje: ${t.descricao}`, detalhe:t.idCliente?refLabel('clientes',t.idCliente):'', onClick:()=>openForm('tarefas',t.id)}));
  // negociações paradas
  store.negociacoes.filter(n=>n.status==='Aberta').forEach(n=>{
    const dias = n.ultimoContato? daysBetween(n.ultimoContato) : null;
    if(dias!==null && dias>7) list.push({peso:70+Math.min(dias,30), icon:'🟠', categoria:'ATENÇÃO', titulo:`Negociação parada: ${refLabel('clientes',n.idCliente)}`, detalhe:`${dias} dia(s) sem contato · ${refLabel('imoveis',n.idImovel)}`, onClick:()=>openForm('negociacoes',n.id)});
  });
  // clientes sem contato / recém cadastrados sem próximo passo
  store.clientes.filter(x=>!['Fechado','Perdido'].includes(x.etapa) && !x.ultimoContato)
    .forEach(cl=> list.push({peso:60, icon:'🟠', categoria:'ATENÇÃO', titulo:`Cliente sem contato: ${cl.nome}`, detalhe:'Nenhum contato registrado ainda', onClick:()=>openForm('clientes',cl.id)}));
  // cliente esperando opções de imóveis (etapa qualificando/novo há mais de 3 dias sem imóvel enviado registrado no histórico)
  store.clientes.filter(x=>['Novo','Qualificando'].includes(x.etapa)).forEach(cl=>{
    const dias = cl.dataCadastro? daysBetween(cl.dataCadastro) : null;
    const jaEnviou = store.historico.some(h=>h.idCliente===cl.id && h.tipo==='Proposta');
    if(dias!==null && dias>=2 && !jaEnviou) list.push({peso:58, icon:'🏠', categoria:'ATENÇÃO', titulo:`${cl.nome} esperando opções de imóveis`, detalhe:`Cadastrado há ${dias} dia(s), nenhum imóvel enviado ainda`, onClick:()=>openFicha('clientes',cl.id)});
  });
  // comissões pendentes/atrasadas
  store.financeiro.map(f=> MODULES.financeiro.computed({...f})).filter(f=>['Pendente','Atrasado'].includes(f.status))
    .forEach(f=> list.push({peso:f.status==='Atrasado'?65:50, icon:'💰', categoria:'FINANCEIRO', titulo:`Comissão ${f.status.toLowerCase()}`, detalhe:`Prevista ${fmtMoney(f.comissaoPrevista)} · venda ${fmtDate(f.dataVenda)}`, onClick:()=>openForm('financeiro',f.id)}));
  // captações vencendo
  store.captacao.filter(cp=>cp.retorno && cp.retorno<=todayISO() && cp.status!=='Captado' && cp.status!=='Recusado')
    .forEach(cp=> list.push({peso:55, icon:'🏠', categoria:'IMÓVEIS', titulo:`Retorno de captação: ${cp.proprietario}`, detalhe:`Previsto para ${fmtDate(cp.retorno)}`, onClick:()=>openForm('captacao',cp.id)}));
  // validade de captação de imóveis vencendo em até 7 dias
  store.imoveis.filter(im=>im.dataValidadeCaptacao && daysBetween(todayISO(), im.dataValidadeCaptacao)!==null && daysBetween(todayISO(), im.dataValidadeCaptacao)<=7 && im.status==='Disponível')
    .forEach(im=>{
      const dias = daysBetween(todayISO(), im.dataValidadeCaptacao);
      list.push({peso: dias<0? 72:50, icon:'🏠', categoria:'IMÓVEIS', titulo:`Captação ${dias<0?'vencida':'vencendo'}: ${im.codigo||im.id}`, detalhe:`Validade ${fmtDate(im.dataValidadeCaptacao)}`, onClick:()=>openFicha('imoveis',im.id)});
    });
  // tarefas de pós-venda pendentes
  store.tarefas.filter(t=>t.status==='Pendente' && t.posVendaAuto && t.data<=todayISO())
    .forEach(t=> list.push({peso:62, icon:'🤝', categoria:'ATENÇÃO', titulo:`Pós-venda: ${t.descricao}`, detalhe:fmtDate(t.data), onClick:()=>openForm('tarefas',t.id)}));
  list.sort((a,b)=>b.peso-a.peso);
  list.forEach((a,i)=> a._idx=i);
  return list;
}

/* =========================================================
   MATCH (derivado de Clientes x Imóveis)
   ========================================================= */
/* Calcula compatibilidade cliente × imóvel considerando tipo, finalidade,
   região/bairro, preço, quartos, banheiros, vagas, área, características
   e forma de pagamento. Retorna {score, reasons:[{ok,text}]}. */
function calcMatch(cl, im){
  let score=0, max=0; const reasons=[];
  const add = (peso, ok, textoOk, textoFalha)=>{
    max+=peso;
    if(ok){ score+=peso; reasons.push({ok:true, text:textoOk}); }
    else if(textoFalha){ reasons.push({ok:false, text:textoFalha}); }
  };
  add(18, !cl.tipoImovel || im.tipo===cl.tipoImovel, `Tipo (${im.tipo||'—'})`, `Tipo desejado: ${cl.tipoImovel}`);
  add(7, !cl.perfil || im.finalidade==='Venda e Aluguel' || (cl.perfil==='Aluguel'? im.finalidade!=='Venda' : im.finalidade!=='Aluguel'), `Finalidade (${im.finalidade||'—'})`);
  const regiaoAlvo = (cl.bairroDesejado||cl.regiao||'').toLowerCase();
  add(14, !regiaoAlvo || (im.bairro||'').toLowerCase().includes(regiaoAlvo), `Região (${im.bairro||'—'})`, `Região desejada: ${cl.bairroDesejado||cl.regiao}`);
  const vmin = Number(cl.valorMinimo||0), vmax = Number(cl.valorMaximo||0), vim = Number(im.valor||0);
  if(vmax){
    if(vim && vim<=vmax && vim>=vmin){ score+=20; max+=20; reasons.push({ok:true, text:`Valor (${fmtMoney(vim)})`}); }
    else if(vim && vim<=vmax*1.1){ max+=20; score+=9; const diff=vim-vmax; reasons.push({ok:false, text:`${fmtMoney(diff)} acima do limite`}); }
    else { max+=20; reasons.push({ok:false, text:`Fora do orçamento (limite ${fmtMoney(vmax)})`}); }
  }
  add(8, !cl.quartosDesejados || Number(im.quartos||0)>=Number(cl.quartosDesejados||0), `${im.quartos||0} quarto(s)`, `Quer ${cl.quartosDesejados}+ quartos`);
  add(5, !cl.banheirosDesejados || Number(im.banheiros||0)>=Number(cl.banheirosDesejados||0), `${im.banheiros||0} banheiro(s)`);
  add(7, !cl.vagasDesejadas || Number(im.vagas||0)>=Number(cl.vagasDesejadas||0), `${im.vagas||0} vaga(s)`, `Quer ${cl.vagasDesejadas}+ vagas`);
  add(5, !cl.areaDesejada || Number(im.areaConstruida||im.area||0)>=Number(cl.areaDesejada||0), `Área construída ${im.areaConstruida||im.area||'—'} m²`);
  if(im.areaTotal) reasons.push({ok:true, text:`Área total ${im.areaTotal} m²`});
  // condomínio — só entra no cálculo se o cliente tiver informado orçamento (informativo, não elimina o imóvel)
  if(im.condominio) reasons.push({ok: Number(im.condominio)<=Math.max(600, vmax*0.006||0), text:`Condomínio ${fmtMoney(im.condominio)}`});
  // situação/modalidade do imóvel × perfil do cliente (ex.: cliente busca "Lançamento")
  if(cl.perfil==='Lançamento' || cl.perfil==='Investimento'){
    add(6, ['Lançamento','Imóvel na planta','Em construção'].includes(im.modalidade), `Modalidade (${im.modalidade||'—'})`, `Cliente busca lançamento/investimento`);
  }
  // forma de pagamento / financiamento
  if(cl.formaPagamento){
    const fp = cl.formaPagamento.toLowerCase();
    if(fp.includes('financ')) add(5, im.financiamento==='Sim', `Aceita financiamento`, `Imóvel não aceita financiamento`);
    else if(fp.includes('fgts')) add(5, im.aceitaFgts==='Sim', `Aceita FGTS`, `Imóvel não aceita FGTS`);
  }
  // características desejadas × comodidades estruturadas do imóvel
  const amenidadesMap = {mobiliado:im.mobiliado==='Sim', elevador:im.elevador==='Sim', piscina:im.piscina==='Sim', varanda:im.varanda==='Sim', suíte:im.suite==='Sim', suite:im.suite==='Sim'};
  if(cl.caracteristicasDesejadas){
    const desejadas = cl.caracteristicasDesejadas.toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    let bateu=0;
    desejadas.forEach(d=>{ if(Object.keys(amenidadesMap).some(k=> d.includes(k) && amenidadesMap[k])) bateu++; });
    if(desejadas.length) add(6, bateu>0, `${bateu}/${desejadas.length} característica(s) desejada(s) encontrada(s)`, `Nenhuma característica desejada encontrada no imóvel`);
  }
  // REGRA OBRIGATÓRIA (item 3): característica INDISPENSÁVEL ausente no imóvel → imóvel NÃO pode aparecer como compatível
  let eliminado = false;
  if(cl.caracteristicasIndispensaveis){
    const indispensaveis = cl.caracteristicasIndispensaveis.toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    indispensaveis.forEach(req=>{
      if(!req) return;
      const key = Object.keys(amenidadesMap).find(k=> req.includes(k));
      if(key!==undefined){
        if(amenidadesMap[key]){ reasons.push({ok:true, text:`Indispensável atendida: ${req}`}); }
        else { eliminado = true; reasons.push({ok:false, text:`INDISPENSÁVEL ausente: ${req} — imóvel incompatível`}); }
      } else {
        // característica sem campo estruturado correspondente: não elimina automaticamente, sinaliza para conferência manual
        reasons.push({ok:null, text:`Conferir manualmente (indispensável): ${req}`});
      }
    });
  }
  // REGRA OBRIGATÓRIA (item 3): característica que o cliente NÃO ACEITA presente no imóvel → imóvel NÃO pode aparecer como compatível
  if(cl.caracteristicasNaoAceita){
    const naoAceitas = cl.caracteristicasNaoAceita.toLowerCase().split(/[,;]/).map(s=>s.trim()).filter(Boolean);
    naoAceitas.forEach(rej=>{
      if(!rej) return;
      const key = Object.keys(amenidadesMap).find(k=> rej.includes(k));
      if(key!==undefined && amenidadesMap[key]){
        eliminado = true;
        reasons.push({ok:false, text:`NÃO ACEITA presente: ${rej} — imóvel incompatível`});
      }
    });
  }
  const pct = eliminado ? 0 : (max? Math.round((score/max)*100) : 0);
  return {score:pct, reasons, incompativel:eliminado};
}
function whatsappLink(rawPhone, text){
  let p = normPhone(rawPhone);
  if(!p) return null;
  if(p.length<=11) p = '55'+p; // assume Brasil se não tiver DDI
  return `https://wa.me/${p}${text? '?text='+encodeURIComponent(text) : ''}`;
}
function mensagemImovel(im){
  return `Olá! Encontrei um imóvel que pode te interessar: ${im.tipo||'Imóvel'} em ${im.bairro||''}, ${fmtMoney(im.valor)}, ${im.quartos||'-'} quarto(s). Posso te enviar mais detalhes e fotos?`;
}
function renderMatch(c){
  const clientesAtivos = store.clientes.filter(x=>!['Fechado','Perdido'].includes(x.etapa));
  const imoveisDisp = store.imoveis.filter(x=>x.status==='Disponível' && x.disponivelMatch==='Sim');
  let matches = [];
  clientesAtivos.forEach(cl=>{
    imoveisDisp.forEach(im=>{
      const {score, reasons} = calcMatch(cl, im);
      if(score>=40) matches.push({cliente:cl, imovel:im, score, reasons});
    });
  });
  matches.sort((a,b)=>b.score-a.score);
  matches = matches.slice(0,60);
  if(!matches.length){
    c.innerHTML = `<div class="empty-state">${iconSvg('match')}<div class="big">Nenhuma sugestão de match ainda</div><p>Cadastre clientes com valor máximo/tipo/região e imóveis disponíveis para ver sugestões aqui.</p></div>`;
    return;
  }
  c.innerHTML = `<div class="match-list">${matches.map((m,idx)=>{
    const color = m.score>=80? 'success' : m.score>=50? 'warn' : 'neutral';
    const colorHex = {success:'var(--success)',warn:'var(--warn)',neutral:'var(--slate)'}[color];
    const bg = {success:'var(--success-bg)',warn:'var(--warn-bg)',neutral:'var(--neutral-bg)'}[color];
    const reasonsHtml = m.reasons.map(r=> r.ok===false? `⚠️ ${escapeHtml(r.text)}` : r.ok===null? `ℹ️ ${escapeHtml(r.text)}` : `✅ ${escapeHtml(r.text)}`).join(' &nbsp; ');
    return `<div class="match-item">
      <div class="match-score" style="background:${bg};color:${colorHex}">${m.score}%</div>
      <div class="info">
        <div class="t1">${escapeHtml(m.cliente.nome)} → ${escapeHtml(m.imovel.codigo||m.imovel.id)} · ${escapeHtml(m.imovel.bairro||'')}</div>
        <div class="t2">${escapeHtml(m.imovel.tipo||'')} · ${fmtMoney(m.imovel.valor)} · orçamento do cliente: ${fmtMoney(m.cliente.valorMaximo)}</div>
        <div class="reasons">${reasonsHtml}</div>
        <div class="row-actions" style="margin-top:8px">
          <button class="btn btn-sm" data-act="cli" data-idx="${idx}">👤 Ver Cliente</button>
          <button class="btn btn-sm" data-act="imv" data-idx="${idx}">🏠 Ver Imóvel</button>
          <button class="btn btn-sm btn-brass" data-act="wa" data-idx="${idx}">📲 Enviar Imóvel</button>
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
  c.querySelectorAll('[data-act="cli"]').forEach(b=> b.onclick = ()=> openForm('clientes', matches[b.dataset.idx].cliente.id));
  c.querySelectorAll('[data-act="imv"]').forEach(b=> b.onclick = ()=> openForm('imoveis', matches[b.dataset.idx].imovel.id));
  c.querySelectorAll('[data-act="wa"]').forEach(b=> b.onclick = ()=>{
    const m = matches[b.dataset.idx];
    const link = whatsappLink(m.cliente.whatsapp, mensagemImovel(m.imovel));
    if(!link){ toast('Este cliente não tem WhatsApp cadastrado.'); return; }
    window.open(link, '_blank');
  });
}

function renderAgenda(c){
  const eventos = [];
  store.visitas.filter(v=>v.status==='Agendada').forEach(v=> eventos.push({
    data:v.data, hora:v.hora, icon:'📅', tipo:'Visita',
    titulo:`Visita — ${refLabel('clientes',v.idCliente)}`, sub:refLabel('imoveis',v.idImovel),
    onClick:()=>openForm('visitas', v.id)
  }));
  store.tarefas.filter(t=>t.status==='Pendente' && t.data).forEach(t=> eventos.push({
    data:t.data, hora:'', icon: t.tipo==='Ligação'?'📞': t.tipo==='WhatsApp'?'💬':'📋', tipo:'Tarefa',
    titulo:t.descricao, sub:t.idCliente? refLabel('clientes',t.idCliente):'',
    onClick:()=>openForm('tarefas', t.id)
  }));
  store.negociacoes.filter(n=>n.status==='Aberta' && n.proximoContato).forEach(n=> eventos.push({
    data:n.proximoContato, hora:'', icon:'🤝', tipo:'Negociação',
    titulo:`Retomar negociação — ${refLabel('clientes',n.idCliente)}`, sub:refLabel('imoveis',n.idImovel),
    onClick:()=>openForm('negociacoes', n.id)
  }));
  store.clientes.filter(x=>!['Fechado','Perdido'].includes(x.etapa) && x.proximoContato && x.respondeu!=='Sim').forEach(cl=> eventos.push({
    data:cl.proximoContato, hora:'', icon:'📞', tipo:'Follow-up',
    titulo:`Follow-up — ${cl.nome}`, sub:cl.whatsapp||'',
    onClick:()=>openFicha('clientes', cl.id)
  }));
  eventos.sort((a,b)=> (a.data||'').localeCompare(b.data||''));

  const hoje = todayISO();
  const amanhaD = new Date(); amanhaD.setDate(amanhaD.getDate()+1);
  const amanha = amanhaD.toISOString().slice(0,10);
  const grupos = [
    {label:'Atrasados', filtro:e=>e.data<hoje},
    {label:'Hoje', filtro:e=>e.data===hoje},
    {label:'Amanhã', filtro:e=>e.data===amanha},
    {label:'Próximos Dias', filtro:e=>e.data>amanha},
  ];
  c.innerHTML = grupos.map(g=>{
    const items = eventos.filter(g.filtro);
    if(!items.length) return '';
    return `<div class="panel">
      <h3>${g.label} <span class="hint">${items.length} evento(s)</span></h3>
      <div class="table-wrap"><table class="data-table"><tbody>
        ${items.map((e,i)=>`<tr data-g="${g.label}" data-i="${i}"><td style="width:90px">${fmtDate(e.data)}</td><td style="width:26px">${e.icon}</td><td class="wrap"><strong>${escapeHtml(e.titulo)}</strong><div style="color:var(--slate);font-size:12px">${escapeHtml(e.sub||'')}</div></td><td style="width:90px"><span class="badge neutral">${e.tipo}</span></td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
  }).join('') || `<div class="empty-state">${iconSvg('calendar')}<div class="big">Agenda vazia</div><p>Nenhuma visita, tarefa ou follow-up agendado.</p></div>`;
  grupos.forEach(g=>{
    const items = eventos.filter(g.filtro);
    $$(`[data-g="${g.label}"]`, c).forEach(tr=>{ tr.style.cursor='pointer'; tr.onclick=()=> items[Number(tr.dataset.i)].onClick(); });
  });
}

function renderTimeline(cli, hist, visitas, negs, tarefas){
  const eventos = [];
  hist.forEach(h=> eventos.push({data:h.dataHora, icon:'💬', texto:`${h.canal||'Contato'} — ${h.descricao||''}`}));
  visitas.forEach(v=> eventos.push({data:v.data, icon:'📅', texto:`Visita ${v.status||''} — ${refLabel('imoveis',v.idImovel)}${v.resultado?' · '+v.resultado:''}`}));
  negs.forEach(n=> eventos.push({data:n.dataProposta, icon:'💰', texto:`Proposta — ${refLabel('imoveis',n.idImovel)} — ${fmtMoney(n.valorProposta)} (${n.etapa})`}));
  tarefas.filter(t=>t.status==='Concluída').forEach(t=> eventos.push({data:t.data, icon:'✅', texto:t.descricao}));
  eventos.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!eventos.length) return `<p style="font-size:13px;color:var(--slate)">Nenhuma interação registrada ainda. Use "Registrar Contato" ou o módulo Histórico para começar a linha do tempo.</p>`;
  return `<div>${eventos.map(e=>`
    <div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="width:20px;flex-shrink:0">${e.icon}</div>
      <div style="flex:1;font-size:13px">${escapeHtml(e.texto||'')}</div>
      <div style="font-size:11.5px;color:var(--slate);white-space:nowrap">${fmtDate(e.data)}</div>
    </div>`).join('')}</div>`;
}

/* Assistente comercial baseado em regras (sem depender de internet).
   Analisa o contexto disponível do cliente e sugere abordagens prontas. */
function runAssistente(acao, cli, hist, matchesParam){
  const out = $('#aiOutput'); out.style.display='block';
  const nome = cli.nome||'';
  if(acao==='proximoPasso'){
    let txt;
    const dias = cli.diasSemContato;
    if(cli.alertaContato==='Atrasado') txt = `🔴 ${nome} está com follow-up atrasado (próximo contato era ${fmtDate(cli.proximoContato)}). Ligue ou mande WhatsApp hoje, reforçando os imóveis compatíveis disponíveis.`;
    else if(!cli.ultimoContato) txt = `Nenhum contato registrado ainda. Faça o primeiro contato hoje mesmo — use "Criar Mensagem" para gerar uma abordagem inicial.`;
    else if(cli.etapa==='Novo'||cli.etapa==='Qualificando') txt = `${nome} está na etapa "${cli.etapa}". Priorize qualificar orçamento/entrada e enviar 2 a 3 imóveis compatíveis para gerar interesse.`;
    else if(cli.etapa==='Visitando') txt = `${nome} está em fase de visitas. Confirme a próxima visita e pergunte o que achou das últimas opções vistas.`;
    else if(cli.etapa==='Negociando') txt = `${nome} está em negociação. Revise a proposta em aberto e busque destravar pontos de atrito (preço, entrada, prazo).`;
    else txt = `Cliente na etapa "${cli.etapa}". Sem alertas críticos no momento — mantenha o contato de rotina.`;
    out.textContent = txt;
  }
  else if(acao==='criarMsg'){
    const base = store.mensagens.find(m=>m.categoria==='Follow-up') || store.mensagens[0];
    const texto = (base?.texto||'Olá {nome}, tudo bem? Aqui é da {corretora}.').replace(/{nome}/g,nome).replace(/{corretora}/g,store.config.corretora||'');
    out.textContent = texto;
  }
  else if(acao==='objecao'){
    const respostas = {
      'Está muito caro':`Entendo, ${nome}. Esse valor considera [diferenciais do imóvel]. Posso verificar com o proprietário se há espaço para negociar a entrada ou o valor final — você teria uma faixa de valor que funcionaria melhor pra você?`,
      'Vou pensar':`Sem problema, ${nome}! Fico à disposição. Só pra eu te ajudar melhor: tem algo específico que ficou em dúvida — localização, valor, ou o próprio imóvel?`,
      'Não tenho entrada agora':`Consigo verificar opções com entrada facilitada, parcelamento direto com o proprietário ou uso do FGTS. Você já consultou seu saldo de FGTS?`,
    };
    out.textContent = `Sugestões de abordagem por objeção comum:\n\n1) "Está muito caro" →\n${respostas['Está muito caro']}\n\n2) "Vou pensar" →\n${respostas['Vou pensar']}\n\n3) "Não tenho entrada agora" →\n${respostas['Não tenho entrada agora']}`;
  }
  else if(acao==='ligacao'){
    out.textContent = `Roteiro rápido de ligação — ${nome}\n\n1. Abertura: "Oi ${nome}, aqui é [seu nome] da ${store.config.corretora}, tudo bem?"\n2. Retomar contexto: relembrar o que ele procura (${cli.tipoImovel||'tipo não informado'}, região ${cli.regiao||cli.bairroDesejado||'não informada'}).\n3. Pergunta-chave: "Ainda está buscando imóvel? O que mudou desde nosso último contato?"\n4. Oferecer valor: mencionar 1-2 imóveis compatíveis novos.\n5. Fechamento: agendar próximo passo (visita, envio de opções, retorno).`;
  }
  else if(acao==='resumo'){
    if(!hist || !hist.length){ out.textContent = 'Ainda não há histórico registrado para este cliente.'; return; }
    const linhas = hist.slice(0,10).map(h=>`• ${fmtDate(h.dataHora)} — ${h.canal||''}: ${h.descricao||''}`);
    out.textContent = `Resumo das últimas interações com ${nome}:\n\n${linhas.join('\n')}`;
  }
  else if(acao==='oferecer'){
    if(!matchesParam || !matchesParam.length){ out.textContent = `Nenhum imóvel do estoque atual é compatível com o perfil de ${nome} agora. Considere ampliar região/orçamento ou buscar nova captação.`; return; }
    const linhas = matchesParam.slice(0,5).map(m=>`• ${m.score}% — ${m.imovel.codigo||m.imovel.id} · ${m.imovel.bairro||''} · ${fmtMoney(m.imovel.valor)}`);
    out.textContent = `Melhores opções para oferecer a ${nome}:\n\n${linhas.join('\n')}`;
  }
}

    </div>

    <div class="panel">
      <h3>Backup automático periódico <span class="hint">sem precisar fazer nada</span></h3>
      <p style="font-size:13px;color:var(--slate);margin:0 0 14px;line-height:1.55">
        A cada poucos minutos de uso (e sempre que você fecha ou minimiza o app), o CRM guarda automaticamente uma cópia completa dos dados
        dentro deste aparelho. São mantidas as últimas ${AUTO_BACKUP_MAX} cópias, como uma rede de segurança extra além do backup exportado.
        Isso <strong>não substitui</strong> o backup em arquivo — continue exportando regularmente para levar os dados a outro aparelho.
      </p>
      ${autoBackups.length? `<div style="display:flex;flex-direction:column;gap:8px">${autoBackups.map((b,idx)=>`
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px">
          <div style="font-size:13px">${fmtDate(b.savedAt.slice(0,16))} · ${b.totalRegistros} registros</div>
          <button class="btn btn-sm" data-autobk-idx="${idx}">Restaurar esta cópia</button>
        </div>`).join('')}</div>` : `<p style="font-size:13px;color:var(--slate)">Ainda não há cópias automáticas — elas aparecem aqui conforme você usa o CRM.</p>`}
    </div>

    <div class="panel">
      <h3>Como usar em celular, computador e iPad</h3>
      <div style="font-size:13px;line-height:1.9;color:var(--text)">
        <strong>1.</strong> Trabalhe normalmente no aparelho principal durante o dia.<br>
        <strong>2.</strong> No fim do dia (ou quando quiser trocar de aparelho), clique em <strong>Backup Agora</strong> aqui em cima.<br>
        <strong>3.</strong> No iPhone, escolha "Salvar em Arquivos" ou envie para você mesmo por WhatsApp/AirDrop/e-mail. Em computador, o arquivo é baixado direto.<br>
        <strong>4.</strong> Abra o CRM no outro aparelho (o mesmo arquivo HTML) e clique em <strong>Escolher Arquivo de Backup</strong>, selecionando o arquivo que você enviou.<br>
        <strong>5.</strong> Pronto — os dois aparelhos ficam com os mesmos dados até a próxima exportação.
      </div>
      <p style="font-size:12px;color:var(--slate);margin:14px 0 0">
        Atenção: o CRM não sincroniza sozinho entre aparelhos — cada exportação é uma "foto" dos dados naquele momento.
        Sempre exporte do aparelho que você usou por último, antes de restaurar em outro, para não perder cadastros recentes.
      </p>
    </div>

    ${renderSafetyPanel()}
  `;
  $('#bkExport').onclick = exportBackup;
  $('#bkImport').onclick = ()=> $('#importFile').click();
  c.querySelectorAll('[data-autobk-idx]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.dataset.autobkIdx);
      const bk = autoBackups[idx];
      if(!bk) return;
      if(!confirm(`Restaurar a cópia automática de ${fmtDate(bk.savedAt.slice(0,16))}? Isso vai substituir os dados atuais neste aparelho.`)) return;
      try{
        localStorage.setItem('crmiq_v1_preRestoreSafety', JSON.stringify({savedAt:new Date().toISOString(), data:store}));
        const restored = migrateStore(Object.assign(defaultStore(), bk.data));
        store = restored;
        store.meta.lastRestoreAt = new Date().toISOString();
        if(save()){
          toast('Cópia automática restaurada. O estado anterior foi guardado como segurança.');
          route();
        }
      }catch(e){ toast('Não foi possível restaurar esta cópia automática. Seus dados atuais não foram alterados.'); }
    };
  });
  const restoreBtn = $('#bkRestoreSafety');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    if(!confirm('Isso vai substituir os dados atuais pela cópia de segurança salva antes da última restauração/limpeza. Continuar?')) return;
    try{
      const safety = JSON.parse(localStorage.getItem('crmiq_v1_preRestoreSafety'));
      store = migrateStore(Object.assign(defaultStore(), safety.data));
      if(save()){ toast('Cópia de segurança restaurada.'); route(); }
    }catch(e){ toast('Não foi possível ler a cópia de segurança. Seus dados atuais não foram alterados.'); }
  };
}
/* Mostra, quando existe, a cópia de segurança salva automaticamente
   antes da última restauração/limpeza de dados (item 25 do briefing). */
function renderSafetyPanel(){
  let safety = null;
  try{ safety = JSON.parse(localStorage.getItem('crmiq_v1_preRestoreSafety')); }catch(e){}
  if(!safety) return '';
  return `<div class="panel" style="border-top:3px solid var(--warn)">
    <h3>Cópia de Segurança Automática</h3>
    <p style="font-size:13px;color:var(--slate);margin:0 0 14px">
      Guardada automaticamente em ${fmtDate(safety.savedAt.slice(0,16))} antes da última restauração ou limpeza de dados neste aparelho.
      Use apenas se algo tiver dado errado na última operação.
    </p>
    <button class="btn" id="bkRestoreSafety">Restaurar Cópia de Segurança</button>
  </div>`;
}

/* =========================================================
   CONFIGURAÇÕES
   ========================================================= */
function renderConfig(c){
  const cfg = store.config;
  c.innerHTML = `
    <div class="panel config-section">
      <h4>Dados da Corretora</h4>
      <div class="form-grid">
        <div class="field"><label>Nome da Corretora</label><input id="cfgCorretora" value="${escapeHtml(cfg.corretora)}"></div>
        <div class="field"><label>Corretor Responsável Padrão</label><input id="cfgCorretor" value="${escapeHtml(cfg.corretorPadrao)}"></div>
        <div class="field"><label>Comissão Padrão (%)</label><input id="cfgComissao" type="number" step="0.1" value="${cfg.comissaoPadrao}"></div>
        <div class="field"><label>Meta Mensal de Comissão</label><input id="cfgMeta" type="number" step="0.01" value="${cfg.metaMensal}"></div>
      </div>
      <div style="margin-top:14px"><button class="btn btn-primary" id="saveConfig">Salvar Configurações</button></div>
    </div>
    <div class="panel config-section">
      <h4>Backup dos Dados</h4>
      <p style="font-size:13px;color:var(--slate);margin:0 0 14px">Todos os dados do CRM ficam salvos apenas neste navegador. Use a página <strong>Backup</strong>, no menu lateral, para exportar/restaurar e sincronizar com outros aparelhos.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-brass" id="goBackupPage">Ir para Backup</button>
        <button class="btn btn-danger" id="resetBtn">Apagar Todos os Dados</button>
      </div>
    </div>
    <div class="panel config-section">
      <h4>Sobre</h4>
      <p style="font-size:13px;color:var(--slate);margin:0">Sistema offline de gestão comercial de Igor Queiroz — Corretor de Imóveis, CRECI-BA 37.167. Funciona sem internet; os dados nunca saem deste dispositivo.</p>
    </div>
  `;
  $('#saveConfig').onclick=()=>{
    cfg.corretora = $('#cfgCorretora').value || 'Minha Corretora';
    cfg.corretorPadrao = $('#cfgCorretor').value;
    cfg.comissaoPadrao = Number($('#cfgComissao').value||0);
    cfg.metaMensal = Number($('#cfgMeta').value||0);
    save(); toast('Configurações salvas.'); renderSidebar();
  };
  $('#goBackupPage').onclick = ()=> location.hash='#backup';
  $('#resetBtn').onclick = ()=>{
    if(confirm('Isso vai apagar TODOS os dados cadastrados. Tem certeza? Esta ação não pode ser desfeita.')){
      if(confirm('Confirme novamente: apagar tudo?')){
        try{ localStorage.setItem('crmiq_v1_preRestoreSafety', JSON.stringify({savedAt:new Date().toISOString(), data:store})); }catch(e){}
        store = defaultStore(); seedMensagens(store);
        if(save()){ toast('Dados apagados. Uma cópia de segurança do estado anterior foi guardada neste aparelho.'); location.hash='#dashboard'; route(); }
      }
    }
  };
}
async function exportBackup(){
  store.meta.lastBackupAt = new Date().toISOString();
  save();
  const filename = `crmiq_backup_${todayISO()}.json`;
  const json = JSON.stringify(store,null,2);
  const blob = new Blob([json], {type:'application/json'});
  // Prioridade (item 2 — uso no iPhone): navigator.share com arquivo, para permitir
  // "Salvar em Arquivos", enviar por WhatsApp/AirDrop/e-mail diretamente, evitando
  // que o iOS simplesmente abra o JSON como uma página de texto no navegador.
  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Backup CRM Queiroz', text:`Backup do CRM — ${fmtDate(todayISO())}`});
      toast('Backup exportado e compartilhado.');
      if(currentView==='backup') renderView();
      return;
    }
  }catch(err){
    // usuário cancelou o compartilhamento ou o navegador não suporta — cai no fallback abaixo
    if(err && err.name==='AbortError'){ if(currentView==='backup') renderView(); return; }
  }
  // Fallback: download tradicional (funciona em computador e na maioria dos navegadores)
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Backup exportado (download).');
  if(currentView==='backup') renderView();
}
$('#importFile').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(confirm('Restaurar este backup vai substituir os dados atuais. Continuar?')){
        // Segurança (item 25): guarda uma cópia do estado atual antes de restaurar,
        // para nunca apagar dados silenciosamente.
        try{ localStorage.setItem('crmiq_v1_preRestoreSafety', JSON.stringify({savedAt:new Date().toISOString(), data:store})); }catch(e){}
        store = migrateStore(Object.assign(defaultStore(), parsed));
        store.meta.lastRestoreAt = new Date().toISOString();
        if(save()){ toast('Backup restaurado. Uma cópia do estado anterior foi guardada automaticamente neste aparelho.'); route(); }
      }
    }catch(err){ toast('Arquivo inválido: '+(err&&err.message?err.message:'não foi possível ler este arquivo.')); }
  };
  reader.onerror = ()=> toast('Não foi possível abrir este arquivo no navegador.');
  reader.readAsText(file);
  e.target.value='';
});

/* ---------------- menu mobile + backup atalho ---------------- */
$('#menuToggle').addEventListener('click', ()=> $('#sidebar').classList.toggle('open'));
$('#btnBackupSidebar').addEventListener('click', ()=>{ location.hash='#backup'; });

/* ---------------- init ---------------- */
route();
</script>
